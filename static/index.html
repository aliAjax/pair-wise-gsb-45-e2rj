<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>港口泊位与航道调度</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: 1rem; align-items: center; }
  </style>
</head>
<body>
<main>
  <h1>港口泊位与航道调度</h1>
  <p>最小演示页。潮位报文、重算运行、冲突草稿与复核队列通过README中的JSON接口操作。</p>
  <div class="row">
    <button id="load">加载记录</button>
    <button id="stats">状态统计</button>
    <button id="tide">潮位报文</button>
    <button id="runs">重算运行</button>
    <button id="drafts">冲突草稿</button>
    <button id="reviews">复核队列</button>
    <button id="bookings">资源占用</button>
  </div>
  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
async function show(path) {
  const response = await fetch(path, {headers});
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
document.getElementById("load").onclick = () => show("/api/records?limit=20");
document.getElementById("stats").onclick = () => show("/api/stats");
document.getElementById("tide").onclick = () => show("/api/tide-reports?limit=20");
document.getElementById("runs").onclick = () => show("/api/recompute-runs?limit=20");
document.getElementById("drafts").onclick = () => show("/api/conflict-drafts?limit=20");
document.getElementById("reviews").onclick = () => show("/api/reviews?limit=20");
document.getElementById("bookings").onclick = () => show("/api/resource-bookings?status=held&limit=50");
</script>
</body>
</html>
